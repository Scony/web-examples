<html>
  <body>
    <script>
      const useDamage = parseInt((new URL(window.location.href)).searchParams.get("ud") || 0) > 0;
      const antialias = parseInt((new URL(window.location.href)).searchParams.get("aa") || 1) > 0;

      var canvas = document.createElement("canvas");
      canvas.width = 1400;
      canvas.height = 600;
      canvas.style.border = '1px solid #000';
      document.body.appendChild(canvas);

      var gl = canvas.getContext('webgl', {preserveDrawingBuffer: true, antialias: antialias});
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.clearColor(0.0, 1.0, 0.0, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.SCISSOR_TEST);
      let oldScissor = [5, 5, 50, 50];
      gl.scissor(5, 5, 50, 50);
      gl.clearColor(0.0, 0.0, 1.0, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      var drawFunction = (i) => {
          gl.clearColor(1.0, 1.0, 1.0, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          var extraSize = (i % 100) * 2;
          if (useDamage && typeof gl.damage === 'function')
              gl.damage(new Float32Array([oldScissor[0], oldScissor[1], oldScissor[2], oldScissor[3]], 5 + extraSize, 5 + extraSize, 50 + extraSize, 50 + extraSize));
          gl.scissor(5 + extraSize, 5 + extraSize, 50 + extraSize, 50 + extraSize);
          oldScissor = [5 + extraSize, 5 + extraSize, 50 + extraSize, 50 + extraSize];
          gl.clearColor(0.0, 0.0, 1.0, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);

          requestAnimationFrame(() => { drawFunction(i + 1); });
      }

      requestAnimationFrame(() => { drawFunction(0); });
    </script>
  </body>
</html>
