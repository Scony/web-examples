<html>
  <head>
    <script id='myWorker' type='text/worker'>
      self.onmessage = (message) => {
          const canvas = message.data.canvas;

          const gl = canvas.getContext('webgl', {preserveDrawingBuffer: true});
          gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
          gl.clearColor(0.0, 1.0, 0.0, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.enable(gl.SCISSOR_TEST);
          gl.scissor(5, 5, 50, 50);
          gl.clearColor(0.0, 0.0, 1.0, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);

          const drawFunction = (i) => {
              gl.clearColor(1.0, 1.0, 1.0, 1.0);
              gl.clear(gl.COLOR_BUFFER_BIT);
              const extraSize = (i % 100) * 2;
              gl.scissor(5 + extraSize, 5 + extraSize, 50 + extraSize, 50 + extraSize);
              gl.clearColor(0.0, 0.0, 1.0, 1.0);
              gl.clear(gl.COLOR_BUFFER_BIT);

              const bitmap = canvas.transferToImageBitmap();
              self.postMessage({ bitmap }, [bitmap]);

              requestAnimationFrame(() => { drawFunction(i + 1); });
          }

          requestAnimationFrame(() => { drawFunction(0); });
      };
    </script>
  </head>
  <body>
    <script>
      var canvas = document.createElement("canvas");
      canvas.width = 1400;
      canvas.height = 600;
      canvas.style.border = '1px solid #000';
      document.body.appendChild(canvas);

      var ctx = canvas.getContext('bitmaprenderer');

      var offscreenCanvas = new OffscreenCanvas(canvas.width, canvas.height);

      var workerBlob = new Blob([document.getElementById('myWorker').textContent]);
      var worker = new Worker(URL.createObjectURL(workerBlob));

      worker.onmessage = (message) => {
          ctx.transferFromImageBitmap(message.data.bitmap);
      };

      worker.postMessage({ canvas: offscreenCanvas }, [offscreenCanvas]);
    </script>
  </body>
</html>
