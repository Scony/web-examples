<html>
  <head>
    <script src="../common/utils.js"></script>
    <script id='myWorker' type='text/worker'>
      self.onmessage = (message) => {
          const canvas = message.data.canvas;

          const ctx = canvas.getContext('2d');

          const drawFunction = (i) => {
              if (i >= 180)
                  return;

              const mi = i % 60;
              let color = 'rgb(255, 0, 0)';

              if (i >= 60)
                  color = 'rgb(0, 255, 0)';
              if (i >= 120)
                  color = 'rgb(0, 0, 255)';

              ctx.fillStyle = 'rgb(230, 230, 230)';
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              let j = 0;
              for (let x = 0; x < 6; ++x) {
                  for (let y = 0; y < 10; ++y) {
                      if (j++ > mi)
                          continue;
                      const px = 30 + x*30 + (x >= 1 ? x * 10 : 0);
                      const py = 30 + y*30 + (y >= 1 ? y * 10 : 0);
                      ctx.fillStyle = color;
                      ctx.fillRect(px, canvas.height - py - 30, 30, 30);
                  }
              }

              requestAnimationFrame(() => { drawFunction(i + 1); });
          }

          requestAnimationFrame(() => { drawFunction(0); });
      };
    </script>
  </head>
  <body>
    <script>
      const delayMs = parseInt((new URL(window.location.href)).searchParams.get("dms") || 500);
      const busyLoopDurationMs = parseInt((new URL(window.location.href)).searchParams.get("bldms") || 500);

      var canvas = document.createElement("canvas");
      canvas.width = 600;
      canvas.height = 600;
      canvas.style.border = '1px solid #000';
      document.body.appendChild(canvas);

      var offscreenCanvas = canvas.transferControlToOffscreen();

      var workerBlob = new Blob([document.getElementById('myWorker').textContent]);
      var worker = new Worker(URL.createObjectURL(workerBlob));

      worker.postMessage({ canvas: offscreenCanvas }, [offscreenCanvas]);

      setTimeout(() => {
          const rAFCallback = () => {
              console.log("main busy...");
              Utils.busyLoop(busyLoopDurationMs);
              console.log("main not busy");
              requestAnimationFrame(rAFCallback);
          }
          requestAnimationFrame(rAFCallback);
      }, delayMs);
    </script>
  </body>
</html>
