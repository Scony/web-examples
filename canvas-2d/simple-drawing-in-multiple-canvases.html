<html>
  <body>
    <script>
      const numberOfCanvases = parseInt((new URL(window.location.href)).searchParams.get("cs") || 3);
      const canvasSize = parseInt((new URL(window.location.href)).searchParams.get("csz") || 100);
      const rectSize = parseInt((new URL(window.location.href)).searchParams.get("rsz") || 10);

      const canvasContexts = [];
      for (let i = 0; i < numberOfCanvases; ++i) {
          var canvas = document.createElement("canvas");
          canvas.width = canvasSize;
          canvas.height = canvasSize;
          canvas.style.border = '1px solid #000';
          document.body.appendChild(canvas);
          canvasContexts.push(canvas.getContext('2d'));
      }

      const rectStates = canvasContexts.map(() => ({
          x: Math.floor(Math.random() * (canvasSize - rectSize + 1)),
          y: Math.floor(Math.random() * (canvasSize - rectSize + 1)),
          dx: Math.random() < 0.5 ? -1 : 1,
          dy: Math.random() < 0.5 ? -1 : 1,
      }));

      function render() {
          for (let i = 0; i < canvasContexts.length; ++i) {
              const ctx = canvasContexts[i];
              const state = rectStates[i];

              ctx.clearRect(0, 0, canvasSize, canvasSize);
              ctx.fillStyle = 'blue';
              ctx.fillRect(state.x, state.y, rectSize, rectSize);

              state.x += state.dx;
              state.y += state.dy;

              if (state.x <= 0) {
                  state.x = 0;
                  state.dx = 1;
              } else if (state.x + rectSize >= canvasSize) {
                  state.x = canvasSize - rectSize;
                  state.dx = -1;
              }

              if (state.y <= 0) {
                  state.y = 0;
                  state.dy = 1;
              } else if (state.y + rectSize >= canvasSize) {
                  state.y = canvasSize - rectSize;
                  state.dy = -1;
              }
          }
          requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    </script>
  </body>
</html>
